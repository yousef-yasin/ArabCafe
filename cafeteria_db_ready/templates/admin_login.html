{% extends 'base.html' %}
{% block content %}
<section class="admin-login-screen">
  <div class="admin-login-deco deco-one">⌁</div>
  <div class="admin-login-deco deco-two">✦</div>
  <div class="admin-login-deco deco-three">⌁</div>

  <div class="admin-login-wrap">
    <div class="admin-login-visual">
      <div class="visual-overlay"></div>
      <div class="food-photo-column">
        <img src="{{ url_for('static', filename='admin-login-salad-main.png') }}" class="admin-food-photo admin-food-photo-main" alt="Arab Cafe Salad">
        <img src="{{ url_for('static', filename='admin-login-salad-bottom.png') }}" class="admin-food-photo admin-food-photo-secondary" alt="Arab Cafe Salad">
      </div>
      <div class="leaf-outline"></div>
    </div>

    <div class="admin-login-form-side">
      <div class="login-card admin-login-card mx-auto">
        <div class="text-center mb-4">
          <img src="{{ url_for('media_logo') }}" class="login-logo admin-login-logo" alt="logo">
          <h2 class="mt-3 mb-1">أهلاً بعودتك!</h2>
          <p class="text-muted mb-0">سجّل دخولك لإدارة الطلبات حسب المبنى.</p>
        </div>

        <form method="POST" class="admin-login-form" autocomplete="off" data-no-autofill="true">
          <div class="mb-3">
            <label class="form-label">اسم المستخدم</label>
            <input type="text" class="form-control form-control-lg rounded-pill" name="username" value="" placeholder="اكتب اسم المستخدم" autocomplete="off" autocapitalize="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')" required>
          </div>

          <div class="mb-3">
            <label class="form-label">كلمة المرور</label>
            <input type="password" class="form-control form-control-lg rounded-pill" name="password" value="" placeholder="اكتب كلمة المرور" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')" required>
          </div>

          <div class="mb-4">
            <label class="form-label">اختار المبنى</label>
            <select class="form-select form-select-lg rounded-pill" name="building" required>
              <option value="" selected disabled>اختار مبنى الطلبات</option>
              <option value="I">مبنى I</option>
              <option value="B">مبنى B</option>
            </select>
            <div class="form-text text-center mt-2">كل أدمن يشوف طلبات المبنى اللي اختاره فقط.</div>
          </div>

          <button class="btn btn-warning btn-lg w-100 rounded-pill fw-bold admin-login-btn">دخول</button>
        </form>
      </div>
    </div>
  </div>
</section>

<script>
  // يمنع المتصفح من تعبئة اسم المستخدم/كلمة المرور تلقائياً في صفحة الأدمن.
  window.addEventListener('pageshow', function () {
    const form = document.querySelector('.admin-login-form');
    if (!form) return;
    form.reset();
    form.querySelectorAll('input[name="username"], input[name="password"]').forEach(function (input) {
      input.value = '';
      input.setAttribute('readonly', 'readonly');
      setTimeout(function(){ input.value = ''; }, 80);
    });
  });
</script>
{% endblock %}
